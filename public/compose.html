<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>twoitter · publicar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <!-- PWA: ver index.html. Manifest + iconos, sin service worker. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0d0c0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="twoitter" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
  <!-- COOP/COEP los sirve el Worker (ver src/index.ts); sin coi-serviceworker. -->
</head>
<body class="compose-page">
  <div class="layout">
    <main class="main-col">
      <p class="compose-nav"><a href="/">← volver al timeline</a></p>
      <form id="composer" class="composer">
        <textarea id="text" placeholder="pega aquí (cmd+v) o escribe... usa #tags"></textarea>
        <div id="mediaPreview" class="media-preview"></div>
        <div id="composerPoll" class="composer-block composer-poll" hidden>
          <div class="composer-block-head">
            <span>encuesta</span>
            <span class="grow"></span>
            <button type="button" class="link-btn poll-close" title="cerrar encuesta">×</button>
          </div>
          <div class="composer-poll-rows"></div>
          <button type="button" class="composer-poll-add composer-block-add">+ añadir opción</button>
        </div>
        <div id="composerLyrics" class="composer-block composer-lyrics" hidden>
          <div class="composer-block-head">
            <span>chords</span>
            <span class="grow"></span>
            <button type="button" class="link-btn lyrics-close" title="cerrar chords">×</button>
          </div>
          <div class="composer-lyrics-rows"></div>
          <button type="button" class="composer-lyrics-add composer-block-add">+ añadir idioma</button>
          <input type="text" class="composer-lyrics-source" placeholder="fuente (opcional)" maxlength="300" aria-label="fuente" />
        </div>
        <div class="composer-foot">
          <label class="file-btn">
            adjuntar
            <input id="fileInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
          </label>
          <button type="button" id="btnRecord" class="rec-btn" aria-label="grabar nota de voz">grabar</button>
          <button type="button" id="btnPoll" class="rec-btn composer-toggle-btn" aria-pressed="false" aria-label="añadir encuesta">encuesta</button>
          <button type="button" id="btnLyrics" class="rec-btn composer-toggle-btn" aria-pressed="false" aria-label="añadir chords">chords</button>
          <button type="button" id="btnGeo" class="geo-btn rec-btn" aria-label="añadir ubicación">ubicación</button>
          <input type="text" id="locInput" class="loc-input" placeholder="nombre del sitio (opcional)" maxlength="120" aria-label="nombre del sitio" hidden />
          <button type="button" id="btnGeoClear" class="geo-clear link-btn" aria-label="quitar ubicación" title="quitar ubicación" hidden>✕</button>
          <span class="grow"></span>
          <button type="submit" id="btnPost" class="btn-primary">publicar</button>
        </div>
      </form>
    </main>
  </div>

  <!-- ffmpeg.js (UMD) expone window.FFmpegWASM; cárgalo antes de compose.js. -->
  <script src="/ffmpeg.js"></script>
  <script type="module" src="/compose.js"></script>
</body>
</html>
