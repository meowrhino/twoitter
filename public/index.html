<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>twoitter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
  <!-- coi-serviceworker añade COOP/COEP en runtime para habilitar
       SharedArrayBuffer y que ffmpeg.wasm multi-thread funcione.
       Tras el primer load instala el SW y la página se recarga sola. -->
  <script src="/coi-serviceworker.js"></script>
</head>
<body>
  <button id="menuBtn" class="menu-btn" aria-label="menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div id="menuPanel" class="menu-panel" hidden>
    <input id="searchBox" type="search" placeholder="buscar…" class="menu-search" />
    <button id="toggleSidebar" class="menu-link as-btn" data-authed-only hidden>mostrar #tags</button>
    <div class="menu-divider"></div>
    <a href="/api/export" class="menu-link" data-authed-only hidden>export json</a>
    <div class="menu-divider" data-authed-only hidden></div>
    <a href="/login.html" class="menu-link" data-anon-only hidden>iniciar sesión</a>
    <form method="post" action="/logout" class="menu-form" data-authed-only hidden>
      <button type="submit" class="menu-link as-btn">salir</button>
    </form>
    <div class="menu-divider"></div>
    <a href="/aviso-legal.html" class="menu-link">aviso legal</a>
  </div>

  <div class="layout" id="layout">
    <main class="main-col">
      <form id="composer" class="composer" data-authed-only hidden>
        <textarea id="text" placeholder="pega aquí (cmd+v) o escribe... usa #tags"></textarea>
        <div id="mediaPreview" class="media-preview"></div>
        <!-- Bloque de encuesta. Oculto por defecto; el botón "encuesta" del
             foot lo despliega. composer.js cablea filas y add/remove. -->
        <div id="composerPoll" class="composer-poll" hidden>
          <div class="composer-poll-head">
            <span>encuesta</span>
            <span class="grow"></span>
            <button type="button" class="link-btn poll-close" title="cerrar encuesta">×</button>
          </div>
          <div class="composer-poll-rows"></div>
          <button type="button" class="composer-poll-add">+ añadir opción</button>
        </div>
        <div class="composer-foot">
          <label class="file-btn">
            adjuntar
            <input id="fileInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
          </label>
          <button type="button" id="btnRecord" class="rec-btn" aria-label="grabar nota de voz">grabar</button>
          <button type="button" id="btnPoll" class="rec-btn poll-btn" aria-pressed="false" aria-label="añadir encuesta">encuesta</button>
          <span class="hint">cmd+v para pegar</span>
          <button type="submit" id="btnPost" class="btn-primary">publicar</button>
        </div>
      </form>

      <div id="filterBanner" class="filter-banner" hidden></div>
      <div id="timeline" class="timeline">
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w90"></div>
          <div class="sk-line sk-w70"></div>
        </div>
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w90"></div>
        </div>
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w70"></div>
          <div class="sk-line sk-w90"></div>
        </div>
      </div>
      <button id="loadMore" class="load-more" hidden>cargar más</button>
    </main>

    <aside id="sideCol" class="side-col" data-authed-only hidden>
      <h2>#tags</h2>
      <ul id="tagList" class="tag-list"></ul>
    </aside>
  </div>

  <!-- ffmpeg.js (UMD) expone window.FFmpegWASM; cárgalo antes de app.js. -->
  <script src="/ffmpeg.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
