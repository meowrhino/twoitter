<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>twoitter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <!-- PWA: instalable (icono en pantalla/dock, ventana propia). Solo manifest +
       iconos; SIN service worker (offline) para no chocar con el COOP/COEP que
       sirve el Worker para ffmpeg.wasm. -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0d0c0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="twoitter" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
  <!-- COOP/COEP (cross-origin isolation, necesario para SharedArrayBuffer/ffmpeg)
       los sirve ahora el Worker en cada respuesta (ver src/index.ts middleware),
       así no hace falta el coi-serviceworker.js y no hay recargas en la 1ª visita. -->
</head>
<body>
  <button id="menuBtn" class="menu-btn" aria-label="menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div id="menuPanel" class="menu-panel" hidden>
    <input id="searchBox" type="search" placeholder="buscar…" class="menu-search" />
    <a href="/compose" class="menu-link" data-authed-only hidden>✍️ publicar (modo ligero)</a>
    <a href="/places" class="menu-link" data-authed-only hidden>📍 sitios guardados</a>
    <button id="toggleSidebar" class="menu-link as-btn" data-authed-only hidden>mostrar #tags</button>
    <div id="typeFilter" class="menu-type-filter" data-authed-only hidden>
      <span class="menu-type-filter-label">tipo</span>
      <a href="/?type=image">imágenes</a>
      <a href="/?type=video">vídeos</a>
      <a href="/?type=audio">audios</a>
      <a href="/?type=poll">encuestas</a>
      <a href="/?type=lyrics">letras</a>
    </div>
    <div class="menu-divider"></div>
    <a href="/api/export" class="menu-link" data-authed-only hidden>export json</a>
    <div class="menu-divider" data-authed-only hidden></div>
    <a href="/login.html" class="menu-link" data-anon-only hidden>iniciar sesión</a>
    <form method="post" action="/logout" class="menu-form" data-authed-only hidden>
      <button type="submit" class="menu-link as-btn">salir</button>
    </form>
    <div class="menu-divider"></div>
    <a href="/aviso-legal.html" class="menu-link">aviso legal</a>
  </div>

  <div class="layout" id="layout">
    <main class="main-col">
      <form id="composer" class="composer" data-authed-only hidden>
        <textarea id="text" placeholder="pega aquí (cmd+v) o escribe... usa #tags"></textarea>
        <div id="mediaPreview" class="media-preview"></div>
        <!-- Bloque de encuesta. Oculto por defecto; el botón "encuesta" del
             foot lo despliega. composer.js cablea filas y add/remove. -->
        <div id="composerPoll" class="composer-block composer-poll" hidden>
          <div class="composer-block-head">
            <span>encuesta</span>
            <span class="grow"></span>
            <button type="button" class="link-btn poll-close" title="cerrar encuesta">×</button>
          </div>
          <div class="composer-poll-rows"></div>
          <button type="button" class="composer-poll-add composer-block-add">+ añadir opción</button>
        </div>
        <!-- Bloque de letras. Oculto por defecto; el botón "letras" del foot lo
             despliega. composer-lyrics.js cablea filas (idioma+texto) y add/remove. -->
        <div id="composerLyrics" class="composer-block composer-lyrics" hidden>
          <div class="composer-block-head">
            <span>letras</span>
            <span class="grow"></span>
            <button type="button" class="link-btn lyrics-close" title="cerrar letras">×</button>
          </div>
          <div class="composer-lyrics-rows"></div>
          <button type="button" class="composer-lyrics-add composer-block-add">+ añadir idioma</button>
          <input type="text" class="composer-lyrics-source" placeholder="fuente (opcional)" maxlength="300" aria-label="fuente" />
        </div>
        <div class="composer-foot">
          <label class="file-btn">
            adjuntar
            <input id="fileInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
          </label>
          <button type="button" id="btnRecord" class="rec-btn" aria-label="grabar nota de voz">grabar</button>
          <button type="button" id="btnPoll" class="rec-btn composer-toggle-btn" aria-pressed="false" aria-label="añadir encuesta">encuesta</button>
          <button type="button" id="btnLyrics" class="rec-btn composer-toggle-btn" aria-pressed="false" aria-label="añadir letras">letras</button>
          <button type="button" id="btnGeo" class="geo-btn rec-btn" aria-label="añadir ubicación">ubicación</button>
          <input type="text" id="locInput" class="loc-input" placeholder="nombre del sitio (opcional)" maxlength="120" aria-label="nombre del sitio" hidden />
          <button type="button" id="btnGeoClear" class="geo-clear link-btn" aria-label="quitar ubicación" title="quitar ubicación" hidden>✕</button>
          <span class="grow"></span>
          <button type="submit" id="btnPost" class="btn-primary">publicar</button>
        </div>
      </form>

      <div id="filterBanner" class="filter-banner" hidden></div>
      <div id="timeline" class="timeline">
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w90"></div>
          <div class="sk-line sk-w70"></div>
        </div>
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w90"></div>
        </div>
        <div class="thread skeleton" aria-hidden="true">
          <div class="sk-line sk-w50"></div>
          <div class="sk-line sk-w70"></div>
          <div class="sk-line sk-w90"></div>
        </div>
      </div>
      <button id="loadMore" class="load-more" hidden>cargar más</button>
    </main>

    <aside id="sideCol" class="side-col" data-authed-only hidden>
      <h2>#tags</h2>
      <ul id="tagList" class="tag-list"></ul>
    </aside>
  </div>

  <!-- ffmpeg.js (UMD) expone window.FFmpegWASM; cárgalo antes de app.js. -->
  <script src="/ffmpeg.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
