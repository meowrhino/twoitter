<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>twoitter — post</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="watermark">twoitter</div>

  <button id="menuBtn" class="menu-btn" aria-label="menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div id="menuPanel" class="menu-panel" hidden>
    <a href="/" class="menu-link">← timeline</a>
    <div class="menu-divider"></div>
    <a href="/api/export" class="menu-link" data-authed-only hidden>export json</a>
    <div class="menu-divider" data-authed-only hidden></div>
    <a href="/login.html" class="menu-link" data-anon-only hidden>iniciar sesión</a>
    <form method="post" action="/logout" class="menu-form" data-authed-only hidden>
      <button type="submit" class="menu-link as-btn">salir</button>
    </form>
  </div>

  <main class="main-col single-post">
    <div id="postContainer"></div>

    <form id="replyForm" class="composer reply-composer" data-authed-only hidden>
      <textarea id="replyText" placeholder="responder..."></textarea>
      <div id="replyMediaPreview" class="media-preview"></div>
      <div class="composer-foot">
        <label class="file-btn">
          adjuntar
          <input id="replyFileInput" type="file" accept="image/*,video/*" multiple hidden />
        </label>
        <button type="submit" class="btn-primary">responder</button>
      </div>
    </form>

    <h2 class="replies-header" id="repliesHeader" hidden>respuestas</h2>
    <div id="replies" class="timeline"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
