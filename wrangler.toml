name = "twoitter"
main = "src/index.ts"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "twoitter.meowrhino.studio", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "twoitter-db"
database_id = "9fec7a62-ec30-4b2d-9eeb-4e1e0caf5552"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "twoitter-storage"

# Workers AI: Whisper para transcribir notas de audio.
# El binding `AI` queda disponible en c.env.AI y permite llamar a modelos como
# @cf/openai/whisper-large-v3-turbo sin secrets externos.
[ai]
binding = "AI"

# Rate limiting nativo de Workers (sin KV ni recurso externo). Lo usa el
# endpoint PÚBLICO de votar encuestas para frenar spam por IP. namespace_id es
# un id lógico que eliges tú; period sólo admite 10 o 60 (segundos).
[[unsafe.bindings]]
name = "VOTE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
